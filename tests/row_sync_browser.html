<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Row sync browser test</title></head>
  <body data-result="pending">Running</body>
  <script type="module">
    import {
      acknowledgeOperations,
      applyRemoteChanges,
      clearLocalState,
      readLocalState,
      readPendingOperations,
      resolveLocalConflicts,
      writeLocalState,
    } from "../www/storage/local-store.js";
    import { createRowSync } from "../www/storage/row-sync.js";

    const body = document.body;
    const keepAlive = setInterval(() => {}, 100);
    try {
      await clearLocalState();
      const documentValue = {
        items: [{ key: "rice", name: "Rice" }],
        dishes: [],
        people: [],
        menu: [],
        stock: [],
        extra_needs: [],
      };
      const state = {
        version: 10,
        language: "en",
        sources: [{ path: "homealacarte_data.json", content: JSON.stringify(documentValue) }],
      };
      await writeLocalState(state, { userId: "browser-test" });
      const initial = await readPendingOperations();
      if (initial.length !== 2) throw new Error(`expected 2 initial operations, got ${initial.length}`);
      await acknowledgeOperations(initial, initial.map((operation, index) => ({
        change_id: index + 1,
        entity_type: operation.entityType,
        entity_id: operation.entityId,
        position: operation.position,
        payload: operation.payload,
        record_version: 1,
        operation: operation.operation,
      })), 2, "browser-test");
      if ((await readPendingOperations()).length !== 0) throw new Error("acknowledged outbox is not empty");

      const reorderedState = await readLocalState();
      const reorderedDocument = JSON.parse(reorderedState.sources[0].content);
      reorderedDocument.items[0] = { name: "Rice", key: "rice" };
      reorderedState.sources[0].content = JSON.stringify(reorderedDocument);
      await writeLocalState(reorderedState, { userId: "browser-test" });
      if ((await readPendingOperations()).length !== 0) {
        throw new Error("JSON object key order created a false local change");
      }

      documentValue.items[0].name = "Local rice";
      state.sources[0].content = JSON.stringify(documentValue);
      await writeLocalState(state, { userId: "browser-test" });
      const { conflicts } = await applyRemoteChanges([{
        change_id: 3,
        entity_type: "items",
        entity_id: "rice",
        position: 0,
        payload: { key: "rice", name: "Remote rice" },
        record_version: 2,
        operation: "upsert",
      }], 3, "browser-test");
      if (conflicts.length !== 1) throw new Error("same-row edit did not conflict");
      await resolveLocalConflicts(conflicts, "remote");
      if ((await readPendingOperations()).length !== 0) throw new Error("remote resolution kept the outbox entry");
      const restored = JSON.parse((await readLocalState()).sources[0].content);
      if (restored.items[0].name !== "Remote rice") throw new Error("remote resolution was not applied");

      restored.items[0].name = "Synced rice";
      const nextState = await readLocalState();
      nextState.sources[0].content = JSON.stringify(restored);
      await writeLocalState(nextState, { userId: "browser-test" });
      let notified = 0;
      let remoteChanges = [{
        change_id: 4,
        entity_type: "people",
        entity_id: "alex",
        position: 0,
        payload: { key: "alex", name: "Alex", kind: "adult", kcal_target: 2000 },
        record_version: 1,
        operation: "upsert",
      }];
      const session = { user: { id: "browser-test", email: "test@example.com" } };
      const sync = createRowSync({
        emitStatus: () => {},
        notifyRemoteChange: () => { notified += 1; },
        remoteClient: {
          ensureSession: async () => session,
          getSession: () => session,
          isNetworkError: () => false,
          touchAccountActivity: async () => {},
          applyRemoteOperations: async (operations) => {
            const applied = operations.map((operation) => ({
              change_id: 5,
              entity_type: operation.entityType,
              entity_id: operation.entityId,
              position: operation.position,
              payload: operation.payload,
              record_version: 3,
              operation: operation.operation,
            }));
            remoteChanges.push(...applied);
            return { cursor: 5, conflicts: [], applied };
          },
          fetchRemoteChanges: async (cursor) => remoteChanges.filter((row) => row.change_id > cursor),
        },
      });
      await sync.synchronize(false);
      if ((await readPendingOperations()).length !== 0) throw new Error("row sync did not drain the outbox");
      const afterConcurrentPull = JSON.parse((await readLocalState()).sources[0].content);
      if (afterConcurrentPull.people[0]?.key !== "alex") {
        throw new Error("remote change preceding the local upload was skipped by the cursor");
      }
      if (afterConcurrentPull.items[0]?.name !== "Synced rice") {
        throw new Error("local upload echo changed the acknowledged record");
      }

      remoteChanges = [...remoteChanges, {
        change_id: 6,
        entity_type: "people",
        entity_id: "alex",
        position: 0,
        payload: { name: "Alex", key: "alex", kcal_target: 2000, kind: "adult" },
        record_version: 2,
        operation: "upsert",
      }];
      await sync.synchronize(true);
      if (notified !== 0) {
        throw new Error("a version-only remote echo announced a visible change");
      }

      remoteChanges = [...remoteChanges, {
        change_id: 7,
        entity_type: "people",
        entity_id: "sam",
        position: 1,
        payload: { key: "sam", name: "Sam", kind: "adult", kcal_target: 1900 },
        record_version: 1,
        operation: "upsert",
      }];
      await sync.synchronize(true);
      const afterPull = JSON.parse((await readLocalState()).sources[0].content);
      if (!afterPull.people.some((person) => person.key === "sam") || notified !== 1) {
        throw new Error("incremental remote pull was not applied and announced");
      }

      let concurrentFetches = 0;
      let maximumConcurrentFetches = 0;
      let fetchCalls = 0;
      const serializedSync = createRowSync({
        emitStatus: () => {},
        notifyRemoteChange: () => {},
        remoteClient: {
          ensureSession: async () => session,
          getSession: () => session,
          isNetworkError: () => false,
          touchAccountActivity: async () => {},
          applyRemoteOperations: async () => ({ conflicts: [], applied: [] }),
          fetchRemoteChanges: async () => {
            fetchCalls += 1;
            concurrentFetches += 1;
            maximumConcurrentFetches = Math.max(maximumConcurrentFetches, concurrentFetches);
            await new Promise((resolve) => setTimeout(resolve, 20));
            concurrentFetches -= 1;
            return [];
          },
        },
      });
      await Promise.all([
        serializedSync.synchronize(true),
        serializedSync.queueSynchronization(),
        serializedSync.synchronize(false),
      ]);
      if (maximumConcurrentFetches !== 1 || fetchCalls !== 1) {
        throw new Error("overlapping synchronization triggers were not coalesced");
      }

      const mismatchStatuses = [];
      let mismatchNetworkCalls = 0;
      const mismatchedSync = createRowSync({
        emitStatus: (status) => mismatchStatuses.push(status),
        notifyRemoteChange: () => {},
        remoteClient: {
          ensureSession: async () => ({ user: { id: "another-account" } }),
          getSession: () => ({ user: { id: "another-account" } }),
          isNetworkError: () => false,
          touchAccountActivity: async () => { mismatchNetworkCalls += 1; },
          applyRemoteOperations: async () => { mismatchNetworkCalls += 1; },
          fetchRemoteChanges: async () => { mismatchNetworkCalls += 1; return []; },
        },
      });
      if (await mismatchedSync.synchronize(false) !== null
          || mismatchNetworkCalls !== 0
          || mismatchStatuses.at(-1)?.message !== "sync_account_mismatch") {
        throw new Error("a different account was allowed to access this IndexedDB replica");
      }

      // A large import spans several sync batches. One conflict choice must apply
      // to the whole queued import instead of prompting again after every batch.
      await clearLocalState();
      const importedItems = Array.from({ length: 205 }, (_, index) => ({
        key: `imported_${index}`,
        name: `Imported ${index}`,
      }));
      await writeLocalState({
        version: 10,
        language: "en",
        sources: [{
          path: "homealacarte_data.json",
          content: JSON.stringify({
            items: importedItems,
            dishes: [],
            people: [],
            menu: [],
            stock: [],
            extra_needs: [],
          }),
        }],
      }, { userId: "browser-test" });
      let conflictApplyCalls = 0;
      let conflictChangeId = 100;
      const conflictStatuses = [];
      const conflictSync = createRowSync({
        emitStatus: (status) => conflictStatuses.push(status),
        notifyRemoteChange: () => {},
        remoteClient: {
          ensureSession: async () => session,
          getSession: () => session,
          isNetworkError: () => false,
          touchAccountActivity: async () => {},
          applyRemoteOperations: async (operations) => {
            conflictApplyCalls += 1;
            const changes = operations.map((operation) => ({
              change_id: ++conflictChangeId,
              entity_type: operation.entityType,
              entity_id: operation.entityId,
              position: operation.position,
              payload: operation.payload,
              record_version: Number(operation.expectedVersion) + 1,
              operation: operation.operation,
            }));
            return operations[0]?.expectedVersion === 0
              ? {
                conflicts: changes.map((change) => ({
                  ...change,
                  payload: { ...change.payload, remote_test_value: true },
                })),
                applied: [],
              }
              : { conflicts: [], applied: changes };
          },
          fetchRemoteChanges: async () => [],
        },
      });
      if (await conflictSync.synchronize(false) !== null) {
        throw new Error("large import did not expose its initial conflict");
      }
      if (!conflictStatuses.some((status) => status.state === "conflict")) {
        throw new Error("large import conflict status was not emitted");
      }
      if (!await conflictSync.resolve("local")) {
        throw new Error("one local resolution did not finish the large import");
      }
      if ((await readPendingOperations()).length !== 0) {
        throw new Error("one local resolution did not drain every import batch");
      }
      if (conflictApplyCalls < 5 || conflictStatuses.at(-1)?.state !== "synced") {
        throw new Error("large import batches were not automatically resolved and synchronized");
      }
      body.dataset.result = "passed";
      body.textContent = "Relational IndexedDB synchronization passed.";
    } catch (error) {
      body.dataset.result = "failed";
      body.textContent = error?.stack || String(error);
    } finally {
      clearInterval(keepAlive);
    }
  </script>
</html>

name: Apply dish fixes 3

on:
  push:
    branches: [aug28_dish_fixes3]
    paths:
      - .github/workflows/apply-dish-fixes3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: |
          python3 scripts/apply_dish_fixes3_once.py
          node tests/dishes_feature.mjs
          node --check www/features/dishes.js
          node --check www/features/menu.js
          git diff --check
      - name: Commit fixes
        run: |
          rm scripts/apply_dish_fixes3_once.py
          rm .github/workflows/apply-dish-fixes3.yml
          git config user.name "bbodin-assistant"
          git config user.email "bodinbla+gpt@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix dish allergen visibility and filter popovers"
          git push origin HEAD:aug28_dish_fixes3

name: Apply catalogue dish usage fix v2

on:
  push:
    branches:
      - fix/catalog-item-dish-usage-2026-08-30

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and compact focused changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/catalogue-usage-fix.yml").read_text()
          marker = "python3 - <<'PY'\n"
          script = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(script), "catalogue-usage-fix", "exec"))

          path = Path("www/features/catalogue.js")
          text = path.read_text()
          replacements = [
              (
                  '  const menuSummary = `${translate("nav_menu")}: ${formatNumber(item.menu_dish_count, 0)}`;\n  const dishSummary = `${translate("nav_dishes")}: ${formatNumber(item.dish_count, 0)}`;',
                  '  const usageSummary = `${translate("nav_menu")}: ${formatNumber(item.menu_dish_count, 0)} · ${translate("nav_dishes")}: ${formatNumber(item.dish_count, 0)}`;',
              ),
              ('    <small>${escapeHtml(`${menuSummary} · ${dishSummary}`)}</small>', '    <small>${escapeHtml(usageSummary)}</small>'),
              ('      item.measure_unit,\n      state.draft || [],', '      item.measure_unit, state.draft || [],'),
              ('      dish_count: dishCount,\n      menu_dish_count: menuDishCount,', '      dish_count: dishCount, menu_dish_count: menuDishCount,'),
              ('    menu_dish_count: 0,\n', ''),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"catalogue compaction snippet not found: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Validate changes
        shell: bash
        run: |
          python3 scripts/check_source_boundaries.py
          node --check www/features/catalogue.js
          node --check www/features/item-details.js
          node --check www/features/catalogue/usage.js
          node --check www/app/feature-composition.js
          node --check www/app.js
          node tests/catalogue_dish_usage.mjs
          node tests/item_details.mjs
          git diff --check
      - name: Commit fixes
        shell: bash
        run: |
          rm .github/workflows/catalogue-usage-fix.yml .github/workflows/catalogue-usage-fix-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add menu and library dish usage to catalogue"
          git push origin HEAD:${GITHUB_REF_NAME}

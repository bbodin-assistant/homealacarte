name: Validate dish UI refinements

on:
  push:
    branches:
      - fix/catalog-item-dish-usage-2026-08-30

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate affected frontend
        shell: bash
        run: |
          python3 scripts/check_source_boundaries.py
          node --check www/features/detail-refinements.js
          node --check www/features/ui-consistency.js
          node --check www/app.js
          node tests/detail_refinements.mjs
          node tests/ui_consistency.mjs
          node tests/dishes_feature.mjs
          node tests/html_partials.mjs
          grep -F 'health.append(allergens, status);' www/features/detail-refinements.js
          grep -F '↗' www/features/detail-refinements.js
          grep -F '#dish-country-filter[open], #dish-allergen-filter[open]' www/features/ui-consistency.js
          git diff --check ba9bd3f9b53fe3ea2d9abbf90e5f7282eeb2c22b..HEAD
      - name: Remove validation workflow
        shell: bash
        run: |
          rm .github/workflows/dish-ui-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove dish UI validation workflow"
          git push origin HEAD:${GITHUB_REF_NAME}

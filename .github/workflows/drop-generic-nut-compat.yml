name: Drop obsolete generic nut compatibility

on:
  push:
    branches: [aug28_ui_fixes2]
    paths:
      - .github/workflows/drop-generic-nut-compat.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove compatibility code
        run: python3 scripts/drop_generic_nut_compat_once.py
      - name: Commit cleanup
        run: |
          git config user.name "bbodin-assistant"
          git config user.email "bodinbla+gpt@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Forget obsolete generic nut allergen"
          git push origin HEAD:aug28_ui_fixes2

name: Remove generic nut allergen

on:
  push:
    branches: [aug28_ui_fixes2]
    paths:
      - .github/workflows/remove-generic-nut.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python3 scripts/remove_generic_nut_once.py
      - name: Commit migration
        run: |
          git config user.name "bbodin-assistant"
          git config user.email "bodinbla+gpt@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove generic nut allergen concept"
          git push origin HEAD:aug28_ui_fixes2

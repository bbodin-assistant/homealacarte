# One-shot migration; this file deletes itself after success.
name: Remove generic nut allergen

on:
  push:
    branches: [aug28_ui_fixes2]
    paths:
      - .github/workflows/remove-generic-nut.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        shell: bash
        run: |
          set +e
          python3 scripts/remove_generic_nut_once.py > /tmp/generic-nut-migration.log 2>&1
          status=$?
          set -e
          cat /tmp/generic-nut-migration.log
          if [[ "$status" -ne 1 ]] || ! grep -q "legacy generic nut code remains" /tmp/generic-nut-migration.log; then
            exit "$status"
          fi
          python3 scripts/remove_generic_nut_fix.py
          legacy="$(printf '%s%s' tree _nut)"
          if git grep -n "$legacy"; then
            echo "Generic nut allergen code still exists in tracked files."
            exit 1
          fi
      - name: Commit migration
        run: |
          git config user.name "bbodin-assistant"
          git config user.email "bodinbla+gpt@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove generic nut allergen concept"
          git push origin HEAD:aug28_ui_fixes2

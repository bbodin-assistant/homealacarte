name: Apply catalogue dish usage fix

on:
  push:
    branches:
      - fix/catalog-item-dish-usage-2026-08-30

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused UI changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1))

          replace_once(
              "www/features/catalogue.js",
              'import { ingredientCatalogueStats } from "./catalogue/usage.js?v=homealacarte-83";',
              'import { ingredientCatalogueStats } from "./catalogue/usage.js?v=homealacarte-109";',
          )
          replace_once(
              "www/features/catalogue.js",
              '''function ingredientUsageMarkup(item) {
            const dishSummary = `${translate("nav_dishes")}: ${formatNumber(item.dish_count, 0)}`;
            const stockSummary = item.stock_quantity
              ? `${translate("current_stock")}: ${formatNumber(item.stock_quantity.quantity, 2)} ${item.stock_quantity.unit}`
              : "";
            return `<span class="item-catalogue-usage">
              <small>${escapeHtml(dishSummary)}</small>
              ${item.stock_quantity ? `<small class="in-stock">${escapeHtml(stockSummary)}</small>` : ""}
            </span>`;
          }''',
              '''function ingredientUsageMarkup(item) {
            const menuSummary = `${translate("nav_menu")}: ${formatNumber(item.menu_dish_count, 0)}`;
            const dishSummary = `${translate("nav_dishes")}: ${formatNumber(item.dish_count, 0)}`;
            const stockSummary = item.stock_quantity
              ? `${translate("current_stock")}: ${formatNumber(item.stock_quantity.quantity, 2)} ${item.stock_quantity.unit}`
              : "";
            return `<span class="item-catalogue-usage">
              <small>${escapeHtml(`${menuSummary} · ${dishSummary}`)}</small>
              ${item.stock_quantity ? `<small class="in-stock">${escapeHtml(stockSummary)}</small>` : ""}
            </span>`;
          }''',
          )
          replace_once(
              "www/features/catalogue.js",
              '''    const { dishCount, stockQuantity } = ingredientCatalogueStats(
                item.key,
                state.snapshot.dishes || [],
                state.stockDraft || [],
                item.measure_unit,
              );''',
              '''    const { dishCount, menuDishCount, stockQuantity } = ingredientCatalogueStats(
                item.key,
                state.snapshot.dishes || [],
                state.stockDraft || [],
                item.measure_unit,
                state.draft || [],
              );''',
          )
          replace_once(
              "www/features/catalogue.js",
              '''      dish_count: dishCount,
                stock_quantity: stockQuantity,''',
              '''      dish_count: dishCount,
                menu_dish_count: menuDishCount,
                stock_quantity: stockQuantity,''',
          )
          replace_once(
              "www/features/catalogue.js",
              '''    dish_count: 0,
              stock_quantity: null,''',
              '''    dish_count: 0,
              menu_dish_count: 0,
              stock_quantity: null,''',
          )

          replace_once(
              "www/features/item-details.js",
              'import { ingredientAllergenBadges } from "./catalogue/allergens.js?v=homealacarte-104";',
              'import { ingredientAllergenBadges } from "./catalogue/allergens.js?v=homealacarte-104";\nimport { dishesUsingIngredient } from "./catalogue/usage.js?v=homealacarte-109";',
          )
          replace_once(
              "www/features/item-details.js",
              '''function groceryItemUsage(item) {
            const dishKeys = new Set(
              state.snapshot.dishes
                .filter((dish) => dish.components.some((component) => component.name === item.name))
                .map((dish) => dish.key),
            );
            const directIngredientKeys = new Set(
              state.snapshot.item_options
                .filter((option) => option.kind === "ingredient" && option.name === item.name)
                .map((option) => option.key),
            );
            const itemNames = new Map(state.snapshot.item_options.map((option) => [option.key, option.name]));
            return state.draft
              .map((row, index) => ({ row, index }))
              .filter(({ row }) => dishKeys.has(row.item_key) || directIngredientKeys.has(row.item_key))
              .map(({ row, index }) => ({
                index,
                name: itemNames.get(row.item_key) || row.item_key,
                context: menuUsageContext(row, state.snapshot.people),
                direct: directIngredientKeys.has(row.item_key),
              }));
          }''',
              '''function groceryItemUsage(item) {
            const itemKey = item?.key || "";
            const dishKeys = new Set(
              (state.snapshot.dishes || [])
                .filter((dish) => (dish.components || []).some((component) => {
                  const componentKey = component.key || component.item_key;
                  return itemKey ? componentKey === itemKey : component.name === item.name;
                }))
                .map((dish) => dish.key),
            );
            const directIngredientKeys = new Set(
              itemKey
                ? [itemKey]
                : (state.snapshot.item_options || [])
                  .filter((option) => option.kind === "ingredient" && option.name === item.name)
                  .map((option) => option.key),
            );
            const itemNames = new Map((state.snapshot.item_options || [])
              .map((option) => [option.key, option.name]));
            return (state.draft || [])
              .map((row, index) => ({ row, index }))
              .filter(({ row }) => dishKeys.has(row.item_key) || directIngredientKeys.has(row.item_key))
              .map(({ row, index }) => ({
                index,
                name: itemNames.get(row.item_key) || row.item_key,
                context: menuUsageContext(row, state.snapshot.people),
                direct: directIngredientKeys.has(row.item_key),
              }));
          }

          function ensureCatalogueDishUsageSection() {
            let section = select("#grocery-details-library-usages");
            if (section) return section;
            select("#grocery-details-usages").insertAdjacentHTML("afterend", `
              <section id="grocery-details-library-usages" hidden>
                <h3 id="grocery-details-library-title"></h3>
                <div id="grocery-details-library-list" class="grocery-details-list"></div>
              </section>`);
            return select("#grocery-details-library-usages");
          }

          function renderCatalogueDishUsage(item) {
            const section = ensureCatalogueDishUsageSection();
            const dishes = item?.key
              ? dishesUsingIngredient(item.key, state.snapshot.dishes || [])
              : [];
            select("#grocery-details-library-title").textContent =
              `${translate("recipes_eyebrow")} · ${translate("nav_dishes")}: ${formatNumber(dishes.length, 0)}`;
            select("#grocery-details-library-list").innerHTML = dishes.map((dish) => {
              const context = [
                dish.source || "",
                dish.servings ? `${formatNumber(dish.servings, 0)} ${translate("servings")}` : "",
              ].filter(Boolean).join(" · ");
              return `<article class="grocery-usage">
                <strong>${escapeHtml(dish.name)}</strong>
                ${context ? `<small>${escapeHtml(context)}</small>` : ""}
              </article>`;
            }).join("");
            section.hidden = dishes.length === 0;
          }''',
          )
          replace_once(
              "www/features/item-details.js",
              '''  select("#grocery-details-usages").hidden = !usages.length;
            const dialog = select("#grocery-details-dialog");''',
              '''  select("#grocery-details-usages").hidden = !usages.length;
            renderCatalogueDishUsage(item && Object.hasOwn(item, "kcal") ? item : null);
            const dialog = select("#grocery-details-dialog");''',
          )

          replace_once(
              "www/app/feature-composition.js",
              'import { createItemDetailsFeature } from "../features/item-details.js?v=homealacarte-104";',
              'import { createItemDetailsFeature } from "../features/item-details.js?v=homealacarte-109";',
          )
          replace_once(
              "www/app/feature-composition.js",
              'import { createCatalogueFeature } from "../features/catalogue.js?v=homealacarte-104";',
              'import { createCatalogueFeature } from "../features/catalogue.js?v=homealacarte-109";',
          )
          replace_once(
              "www/app.js",
              'import { createFeatureComposition } from "./app/feature-composition.js?v=homealacarte-105";',
              'import { createFeatureComposition } from "./app/feature-composition.js?v=homealacarte-109";',
          )
          replace_once(
              "www/index.html",
              '<small class="app-version" aria-label="Version de l’application">v108</small>',
              '<small class="app-version" aria-label="Version de l’application">v109</small>',
          )
          replace_once(
              "www/index.html",
              '<script type="module" src="./app.js?v=homealacarte-108"></script>',
              '<script type="module" src="./app.js?v=homealacarte-109"></script>',
          )

          test = '''import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import {
            dishesUsingIngredient,
            ingredientCatalogueStats,
            menuUsesForIngredient,
          } from "../www/features/catalogue/usage.js";

          const dishes = [
            { key: "apple-pie", name: "Apple pie", components: [{ key: "apple", name: "Apple" }] },
            { key: "fruit-salad", name: "Fruit salad", components: [{ item_key: "apple", name: "Apple" }] },
            { key: "pear-tart", name: "Pear tart", components: [{ key: "pear", name: "Pear" }] },
          ];
          const menuRows = [
            { item_key: "apple-pie" },
            { item_key: "apple" },
            { item_key: "pear-tart" },
          ];

          assert.deepEqual(
            dishesUsingIngredient("apple", dishes).map((dish) => dish.key),
            ["apple-pie", "fruit-salad"],
          );
          assert.equal(menuUsesForIngredient("apple", dishes, menuRows).length, 2);
          assert.deepEqual(
            ingredientCatalogueStats("apple", dishes, [], "piece", menuRows),
            { dishCount: 2, menuDishCount: 2, stockQuantity: null },
          );

          const [catalogue, details] = await Promise.all([
            readFile(new URL("../www/features/catalogue.js", import.meta.url), "utf8"),
            readFile(new URL("../www/features/item-details.js", import.meta.url), "utf8"),
          ]);
          assert.match(catalogue, /menu_dish_count/);
          assert.match(catalogue, /translate\("nav_menu"\)/);
          assert.match(details, /grocery-details-library-usages/);
          assert.match(details, /dishesUsingIngredient/);

          console.log("Catalogue separates current-menu uses from all recipe-library dish uses.");
          '''
          Path("tests/catalogue_dish_usage.mjs").write_text(test)

          makefile = Path("Makefile")
          text = makefile.read_text()
          marker = "\tnode tests/html_partials.mjs\n"
          if marker not in text:
              raise SystemExit("test-web insertion point not found")
          makefile.write_text(text.replace(marker, marker + "\tnode tests/catalogue_dish_usage.mjs\n", 1))
          PY
      - name: Validate changes
        shell: bash
        run: |
          python3 scripts/check_source_boundaries.py
          node --check www/features/catalogue.js
          node --check www/features/item-details.js
          node --check www/features/catalogue/usage.js
          node --check www/app/feature-composition.js
          node --check www/app.js
          node tests/catalogue_dish_usage.mjs
          node tests/item_details.mjs
          git diff --check
      - name: Commit fixes
        shell: bash
        run: |
          rm .github/workflows/catalogue-usage-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add menu and library dish usage to catalogue"
          git push origin HEAD:${GITHUB_REF_NAME}
